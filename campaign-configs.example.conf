# campaign 配置文件模板 —— 每行一个配置，轮内按行序右旋配对交错
# 用法: ./run-bench-jdk.sh geo 3 本文件     （或 CONF=本文件 ./run-bench-jdk.sh geo 3）
# 3 种配置 × 3 轮 = 9 场：r1 [A,B,C] / r2 [C,A,B] / r3 [B,C,A]
#
# 允许的键（空格分隔的 KEY=VALUE，值内不能有空格）：
#   ENGINE_NAME     easysearch | elasticsearch
#   ENGINE_VERSION  如 2.5.0 / 8.19.23
#   ENGINE_BUILD    仅 easysearch（默认 3015）；elasticsearch 没有 build 号
#   JDK_DIR         虚机上已解压的 JDK 目录（仅 easysearch；缺省 = bundle 自带）
#   CAR_LABEL       元数据标签（缺省 = JDK_DIR basename 或引擎身份）；多配置必须互不相同
#   JDK_WANT        可选期望身份 "major|vendor"（如 25|OpenJDK），仅进 sidecar 元数据

# 配置 A：easysearch 2.5.0-3015 自带 JDK
ENGINE_NAME=easysearch ENGINE_VERSION=2.5.0 ENGINE_BUILD=3015 CAR_LABEL=ez3015

# 配置 B：同引擎换 TencentKona 25（JDK_DIR 是虚机上的目录）
ENGINE_NAME=easysearch ENGINE_VERSION=2.5.0 ENGINE_BUILD=3015 JDK_DIR=/opt/jdks/tencentkona-25.0.4 CAR_LABEL=kona25

# 配置 C：Elasticsearch 8.19.23 参照（自带 JDK，无 build 号）
ENGINE_NAME=elasticsearch ENGINE_VERSION=8.19.23 CAR_LABEL=es819
